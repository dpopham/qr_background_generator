[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qr-background-generator"
version = "1.0.0"
description = "Generate 1280x720 video-conference backgrounds containing QR codes."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Darren Popham" }]
dependencies = [
    "Flask>=3.1,<4",
    "Pillow>=11,<13",
    "qrcode[pil]>=8,<9",
]

[project.optional-dependencies]
dev = [
    "gunicorn>=23,<27",
    "pytest>=8,<10",
    "ruff>=0.13,<0.18",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.setuptools.packages.find]
include = ["qr_background_generator*"]

[tool.setuptools.package-data]
qr_background_generator = ["templates/*.html"]
